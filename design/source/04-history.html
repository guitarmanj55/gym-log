<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#0E0F11}
a{color:inherit;text-decoration:none}
input::placeholder{color:#9EA3AD}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E0F11;color:#F2F3F5;font-family:'Barlow',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="flex:1;min-height:0;box-sizing:border-box;padding:64px 20px 0;display:flex;flex-direction:column;gap:14px">

    <h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-size:48px;font-weight:700;line-height:1">History</h1>

    <div style="position:relative">
      <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search lifts or sessions</label>
      <div style="position:absolute;left:14px;top:14px;color:#9EA3AD"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></div>
      <input id="q" type="search" placeholder="Search lifts or sessions" style="box-sizing:border-box;width:100%;height:48px;padding:0 14px 0 44px;border-radius:12px;border:1px solid #2A2E35;background:#17191D;color:#F2F3F5;font-family:'Barlow',sans-serif;font-size:16px">
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:13px;font-weight:600;letter-spacing:0.08em;color:#9EA3AD">THIS WEEK</div>
      <a href="Lift.dc.html" style="display:flex;flex-direction:column;gap:8px;background:#17191D;border:1px solid #2A2E35;border-radius:16px;padding:14px 16px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <div style="font-size:17px;font-weight:600">Mon 19 Oct · Bench</div>
          <div style="font-size:14px;color:#9EA3AD">1h 04</div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:15px"><div style="display:flex;align-items:center;gap:8px"><span style="color:#9EA3AD">Bench press</span><span style="height:20px;padding:0 7px;border-radius:6px;background:#C8F54A;color:#0E0F11;font-size:12px;font-weight:700;display:inline-flex;align-items:center">PR</span></div><div style="font-weight:600">100 × 6</div></div>
        <div style="display:flex;justify-content:space-between;font-size:15px"><div style="color:#9EA3AD">Barbell row</div><div style="font-weight:600">80 × 8</div></div>
      </a>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:13px;font-weight:600;letter-spacing:0.08em;color:#9EA3AD">LAST WEEK</div>
      <a href="Lift.dc.html" style="display:flex;flex-direction:column;gap:8px;background:#17191D;border:1px solid #2A2E35;border-radius:16px;padding:14px 16px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <div style="font-size:17px;font-weight:600">Fri 16 Oct · Deadlift</div>
          <div style="font-size:14px;color:#9EA3AD">0h 52</div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:15px"><div style="color:#9EA3AD">Deadlift</div><div style="font-weight:600">180 × 3</div></div>
        <div style="display:flex;justify-content:space-between;font-size:15px"><div style="color:#9EA3AD">Pull-up</div><div style="font-weight:600">BW + 10 × 6</div></div>
      </a>
      <a href="Lift.dc.html" style="display:flex;flex-direction:column;gap:8px;background:#17191D;border:1px solid #2A2E35;border-radius:16px;padding:14px 16px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <div style="font-size:17px;font-weight:600">Wed 14 Oct · Squat</div>
          <div style="font-size:14px;color:#9EA3AD">1h 12</div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:15px"><div style="display:flex;align-items:center;gap:8px"><span style="color:#9EA3AD">Squat</span><span style="height:20px;padding:0 7px;border-radius:6px;background:#C8F54A;color:#0E0F11;font-size:12px;font-weight:700;display:inline-flex;align-items:center">PR</span></div><div style="font-weight:600">140 × 5</div></div>
        <div style="display:flex;justify-content:space-between;font-size:15px"><div style="color:#9EA3AD">Romanian deadlift</div><div style="font-weight:600">120 × 8</div></div>
      </a>
    </div>
  </div>

  <div style="display:flex;box-sizing:border-box;padding:8px 12px 28px;border-top:1px solid #2A2E35;background:#0E0F11">
    <a href="Main.dc.html" style="flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9EA3AD">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span style="font-size:12px;font-weight:500">Today</span>
    </a>
    <a href="History.dc.html" style="flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#C8F54A">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span style="font-size:12px;font-weight:600">History</span>
    </a>
    <a href="Lift.dc.html" style="flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9EA3AD">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>
      <span style="font-size:12px;font-weight:500">Lifts</span>
    </a>
    <a href="Backup.dc.html" style="flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9EA3AD">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      <span style="font-size:12px;font-weight:500">Backup</span>
    </a>
  </div>
</div>
</x-dc>

</body>
</html>
