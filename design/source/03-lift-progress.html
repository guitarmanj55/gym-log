<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lift progress</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#0E0F11}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E0F11;color:#F2F3F5;font-family:'Barlow',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="flex:1;min-height:0;box-sizing:border-box;padding:64px 20px 0;display:flex;flex-direction:column;gap:16px">

    <div style="display:flex;align-items:center;justify-content:space-between">
      <h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-size:48px;font-weight:700;line-height:1">Squat</h1>
      <button type="button" style="height:44px;padding:0 14px;border-radius:12px;border:1px solid #3A3F48;background:transparent;color:#F2F3F5;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px">
        Change lift
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div style="display:flex;align-items:flex-end;justify-content:space-between">
      <div>
        <div style="font-size:13px;font-weight:600;letter-spacing:0.08em;color:#9EA3AD">ESTIMATED 1RM</div>
        <div style="display:flex;align-items:baseline;gap:6px">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:68px;font-weight:700;line-height:1">163</div>
          <div style="font-size:22px;font-weight:500;color:#9EA3AD">kg</div>
        </div>
      </div>
      <div style="height:32px;padding:0 12px;border-radius:16px;background:#1F2A0E;color:#C8F54A;font-size:14px;font-weight:600;display:flex;align-items:center;margin-bottom:10px">+8 kg in 3 months</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;gap:4px;background:#17191D;border-radius:14px;padding:4px">
        <button type="button" style="flex:1;height:44px;border:none;border-radius:10px;background:transparent;color:#9EA3AD;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600">1M</button>
        <button type="button" aria-pressed="true" style="flex:1;height:44px;border:none;border-radius:10px;background:#2A2E35;color:#F2F3F5;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600">3M</button>
        <button type="button" style="flex:1;height:44px;border:none;border-radius:10px;background:transparent;color:#9EA3AD;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600">1Y</button>
        <button type="button" style="flex:1;height:44px;border:none;border-radius:10px;background:transparent;color:#9EA3AD;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600">All</button>
      </div>
      <svg viewBox="0 0 350 150" width="100%" role="img" aria-label="Estimated one-rep max for squat rising from 148 kilograms in July to 163 kilograms in October" style="display:block">
        <line x1="10" y1="104.4" x2="340" y2="104.4" stroke="#2A2E35" stroke-width="1"/>
        <line x1="10" y1="53" x2="340" y2="53" stroke="#2A2E35" stroke-width="1"/>
        <text x="10" y="99" fill="#9EA3AD" font-size="11" font-family="Barlow, sans-serif">150</text>
        <text x="10" y="47.5" fill="#9EA3AD" font-size="11" font-family="Barlow, sans-serif">160</text>
        <line x1="10" y1="112" x2="340" y2="38" stroke="#5A606B" stroke-width="1.5" stroke-dasharray="4 4"/>
        <polyline points="10,114.6 40,104.4 70,94.1 100,99.3 130,83.8 160,73.6 190,78.7 220,63.3 250,53 280,58.2 310,42.8 340,37.7" fill="none" stroke="#C8F54A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="340" cy="37.7" r="5" fill="#C8F54A"/>
        <text x="10" y="146" fill="#9EA3AD" font-size="11" font-family="Barlow, sans-serif">Jul</text>
        <text x="115" y="146" fill="#9EA3AD" font-size="11" font-family="Barlow, sans-serif" text-anchor="middle">Aug</text>
        <text x="225" y="146" fill="#9EA3AD" font-size="11" font-family="Barlow, sans-serif" text-anchor="middle">Sep</text>
        <text x="340" y="146" fill="#9EA3AD" font-size="11" font-family="Barlow, sans-serif" text-anchor="end">Oct</text>
      </svg>
    </div>

    <div style="display:flex;gap:10px">
      <div style="flex:1;background:#17191D;border:1px solid #2A2E35;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px">
        <div style="font-size:12px;color:#9EA3AD">Heaviest set</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700">145 × 3</div>
      </div>
      <div style="flex:1;background:#17191D;border:1px solid #2A2E35;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px">
        <div style="font-size:12px;color:#9EA3AD">Reps at 140 kg</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700">5</div>
      </div>
      <div style="flex:1;background:#17191D;border:1px solid #2A2E35;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px">
        <div style="font-size:12px;color:#9EA3AD">Top sets</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700">12</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column">
      <div style="font-size:13px;font-weight:600;letter-spacing:0.08em;color:#9EA3AD;margin-bottom:2px">TOP-SET HISTORY</div>
      <div style="display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid #2A2E35">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="font-size:15px;color:#9EA3AD;width:52px">14 Oct</div>
          <div style="font-size:17px;font-weight:600">140 × 5</div>
          <div style="height:22px;padding:0 8px;border-radius:6px;background:#C8F54A;color:#0E0F11;font-size:12px;font-weight:700;display:flex;align-items:center">PR</div>
        </div>
        <div style="font-size:14px;color:#9EA3AD">e1RM 163</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;min-height:48px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="font-size:15px;color:#9EA3AD;width:52px">7 Oct</div>
          <div style="font-size:17px;font-weight:600">135 × 6</div>
        </div>
        <div style="font-size:14px;color:#9EA3AD">e1RM 162</div>
      </div>
    </div>
  </div>

  <div style="display:flex;box-sizing:border-box;padding:8px 12px 28px;border-top:1px solid #2A2E35;background:#0E0F11">
    <a href="Main.dc.html" style="flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9EA3AD">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span style="font-size:12px;font-weight:500">Today</span>
    </a>
    <a href="History.dc.html" style="flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9EA3AD">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span style="font-size:12px;font-weight:500">History</span>
    </a>
    <a href="Lift.dc.html" style="flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#C8F54A">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>
      <span style="font-size:12px;font-weight:600">Lifts</span>
    </a>
    <a href="Backup.dc.html" style="flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9EA3AD">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      <span style="font-size:12px;font-weight:500">Backup</span>
    </a>
  </div>
</div>
</x-dc>

</body>
</html>
