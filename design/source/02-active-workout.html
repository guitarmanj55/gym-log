<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Active workout</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#0E0F11}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E0F11;color:#F2F3F5;font-family:'Barlow',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="flex:1;min-height:0;box-sizing:border-box;padding:60px 20px 0;display:flex;flex-direction:column;gap:10px">

    <div style="display:flex;align-items:center;justify-content:space-between;min-height:52px">
      <a href="Main.dc.html" aria-label="Back to Today" style="width:44px;height:44px;display:flex;align-items:center;justify-content:flex-start;color:#F2F3F5">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div style="text-align:center">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;line-height:1">Squat</div>
        <div style="font-size:13px;color:#9EA3AD;margin-top:2px">Exercise 1 of 4 · 41:12</div>
      </div>
      <a href="Main.dc.html" style="min-width:44px;height:44px;display:flex;align-items:center;justify-content:flex-end;font-size:16px;font-weight:600;color:#C8F54A">Finish</a>
    </div>

    <div style="background:#17191D;border:1px solid #2A2E35;border-radius:16px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:baseline;gap:10px">
          <div style="font-size:12px;font-weight:600;letter-spacing:0.08em;color:#9EA3AD">REST</div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;line-height:1;color:#C8F54A">01:46</div>
        </div>
        <div style="display:flex;gap:8px">
          <button type="button" style="min-width:64px;height:44px;border-radius:12px;border:1px solid #3A3F48;background:transparent;color:#F2F3F5;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600">+30s</button>
          <button type="button" style="min-width:64px;height:44px;border-radius:12px;border:1px solid #3A3F48;background:transparent;color:#F2F3F5;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600">Skip</button>
        </div>
      </div>
      <div style="height:4px;border-radius:2px;background:#2A2E35"><div style="width:58%;height:4px;border-radius:2px;background:#C8F54A"></div></div>
    </div>

    <div style="font-size:14px;color:#9EA3AD">Last time · 140 kg × 5 · e1RM 163 kg</div>

    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="display:grid;grid-template-columns:44px 1fr 1fr 44px;column-gap:10px;font-size:12px;font-weight:600;letter-spacing:0.08em;color:#9EA3AD">
        <div>SET</div><div>KG</div><div>REPS</div><div></div>
      </div>
      <div style="display:grid;grid-template-columns:44px 1fr 1fr 44px;column-gap:10px;align-items:center;min-height:46px">
        <div style="width:32px;height:24px;border-radius:8px;background:#1F2227;color:#C9CCD2;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">W</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:600;color:#C9CCD2">60</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:600;color:#C9CCD2">8</div>
        <div role="img" aria-label="Completed" style="width:36px;height:36px;border-radius:50%;background:#C8F54A;display:flex;align-items:center;justify-content:center;color:#0E0F11"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div>
      </div>
      <div style="display:grid;grid-template-columns:44px 1fr 1fr 44px;column-gap:10px;align-items:center;min-height:46px">
        <div style="width:32px;height:24px;border-radius:8px;background:#1F2227;color:#C9CCD2;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">W</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:600;color:#C9CCD2">100</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:600;color:#C9CCD2">3</div>
        <div role="img" aria-label="Completed" style="width:36px;height:36px;border-radius:50%;background:#C8F54A;display:flex;align-items:center;justify-content:center;color:#0E0F11"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div>
      </div>
    </div>

    <div style="background:#17191D;border:1.5px solid #C8F54A;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="height:28px;padding:0 12px;border-radius:8px;background:#C8F54A;color:#0E0F11;font-size:13px;font-weight:700;letter-spacing:0.06em;display:flex;align-items:center">TOP SET</div>
        <button type="button" aria-pressed="true" style="height:44px;padding:0 14px;border-radius:12px;border:1px solid #C8F54A;background:transparent;color:#C8F54A;font-family:'Barlow',sans-serif;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
          To failure
        </button>
      </div>

      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:44px;font-size:12px;font-weight:600;letter-spacing:0.08em;color:#9EA3AD">KG</div>
        <button type="button" aria-label="Decrease weight by 2.5 kilograms" style="width:52px;height:52px;border-radius:14px;border:none;background:#1F2227;color:#F2F3F5;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <div style="flex:1;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:50px;font-weight:700;line-height:1">142.5</div>
        <button type="button" aria-label="Increase weight by 2.5 kilograms" style="width:52px;height:52px;border-radius:14px;border:none;background:#1F2227;color:#F2F3F5;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>

      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:44px;font-size:12px;font-weight:600;letter-spacing:0.08em;color:#9EA3AD">REPS</div>
        <button type="button" aria-label="Decrease reps" style="width:52px;height:52px;border-radius:14px;border:none;background:#1F2227;color:#F2F3F5;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <div style="flex:1;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:50px;font-weight:700;line-height:1">5</div>
        <button type="button" aria-label="Increase reps" style="width:52px;height:52px;border-radius:14px;border:none;background:#1F2227;color:#F2F3F5;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>

      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;font-size:14px">
        <div style="color:#C8F54A;font-weight:600">e1RM 166 kg · +3 vs last</div>
        <div style="color:#9EA3AD">Per side 25 · 25 · 10 · 1.25</div>
      </div>

      <button type="button" style="height:56px;width:100%;border:none;border-radius:14px;background:#C8F54A;color:#0E0F11;font-family:'Barlow',sans-serif;font-size:18px;font-weight:600">Log top set</button>
    </div>

    <div style="display:grid;grid-template-columns:44px 1fr 1fr 44px;column-gap:10px;align-items:center;min-height:46px;opacity:1">
      <div style="width:32px;height:24px;border-radius:8px;background:#1F2227;color:#9EA3AD;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">BO</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:600;color:#9EA3AD">120</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:600;color:#9EA3AD">8</div>
      <div role="img" aria-label="Not done" style="width:36px;height:36px;box-sizing:border-box;border-radius:50%;border:1.5px solid #3A3F48"></div>
    </div>
  </div>

  <a href="Active.dc.html" style="display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;min-height:48px;margin:0 20px 28px;padding:0 4px;border-top:1px solid #2A2E35;font-size:15px;color:#9EA3AD">
    <span>Next: Romanian deadlift</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </a>
</div>
</x-dc>

</body>
</html>
