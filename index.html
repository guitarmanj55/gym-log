<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Gym Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0E0F11;
  --surface:#17191D;
  --raised:#1F2227;
  --line:#2A2E35;
  --line-strong:#3A3F48;
  --text:#F2F3F5;
  --text-2:#C9CCD2;
  --muted:#9EA3AD;
  --accent:#C8F54A;
  --on-accent:#0E0F11;
  --warn:#F5B84A;
  --warn-bg:#241D0E;
  --warn-line:#4A3A12;
  --font-body:'Barlow', system-ui, -apple-system, sans-serif;
  --font-num:'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  --safe-top:max(env(safe-area-inset-top), 20px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  /* Space under the tab bar: 28px on an iPhone 16 Pro (34px home-indicator inset), like the design and iOS tab bars. */
  --tabs-bottom:max(calc(var(--safe-bottom) - 6px), 8px);
  color-scheme:dark;
}

/* ============ BASE ============ */
*{box-sizing:border-box}
html{background:var(--bg)}
/* At least the full screen tall. In the iOS home-screen app a page shorter than the screen
   gets a short viewport and the fixed tab bar floats above the bottom; long pages were fine. */
body{
  margin:0;min-height:100vh;min-height:100lvh;
  background:var(--bg);color:var(--text);font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}

/* The page itself scrolls; the tab bar is fixed over it, so leave room for the bar (6 + 48 + 1px border). */
#screen{padding-bottom:calc(var(--tabs-bottom) + 55px)}
.screen{padding:calc(var(--safe-top) + 12px) 20px 24px;display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}

/* ============ TYPE ============ */
.date{font-size:15px;font-weight:500;color:var(--muted)}
.title{margin:2px 0 0;font-family:var(--font-num);font-size:48px;font-weight:700;line-height:1;letter-spacing:0.01em}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase}
.lead{font-size:16px;line-height:1.45;color:var(--text-2)}
.note{font-size:13px;line-height:1.45;color:var(--muted)}
.center{text-align:center}

/* ============ BLOCKS ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px;display:flex;flex-direction:column}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--line);font-size:16px}
.list-row:last-child{border-bottom:none}
.list-row > :first-child{color:var(--text-2)}
.list-row > :last-child{font-weight:600}

.banner{border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.banner .dot{width:10px;height:10px;border-radius:50%;flex:none}
.banner-title{font-size:17px;font-weight:600}
.banner-sub{font-size:14px;color:var(--text-2);margin-top:2px}
.banner.warn{background:var(--warn-bg);border:1px solid var(--warn-line)}
.banner.warn .dot{background:var(--warn)}
.banner.warn .banner-title{color:var(--warn)}
.banner.ok{background:var(--surface);border:1px solid var(--line)}
.banner.ok .dot{background:var(--accent)}

.stack{display:flex;flex-direction:column;gap:10px}
.btn{height:56px;width:100%;border-radius:14px;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;border:none;touch-action:manipulation}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:transparent;border:1px solid var(--line-strong);color:var(--text)}
.btn:active{opacity:0.8;transform:scale(0.99)}
.btn:disabled{opacity:0.45}

.toggle-row{display:flex;justify-content:space-between;align-items:center;min-height:52px;font-size:16px;font-weight:500}
.switch{width:56px;height:34px;border:none;border-radius:17px;background:var(--line-strong);padding:3px;display:flex;justify-content:flex-start;align-items:center;flex:none}
.switch span{width:28px;height:28px;border-radius:50%;background:var(--text);display:block}
.switch[aria-checked="true"]{background:var(--accent);justify-content:flex-end}
.switch[aria-checked="true"] span{background:var(--on-accent)}

.chip-btn{min-width:64px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:transparent;color:var(--text);font-size:15px;font-weight:600;touch-action:manipulation}
.text-btn{background:none;border:none;color:var(--muted);font-size:15px;font-weight:600;min-height:44px;padding:0 4px}
.text-btn.danger{color:var(--warn)}
.text-input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line-strong);background:var(--raised);color:var(--text);font-size:17px;padding:0 14px}
.text-input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.up-next{font-family:var(--font-num);font-size:58px;font-weight:700;line-height:0.95}
.note-lg{font-size:14px;line-height:1.4;color:var(--muted)}
.muted{color:var(--muted)}
a.btn{text-decoration:none}

/* ============ TODAY ============ */
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.kv > :first-child{font-size:15px;color:var(--muted)}
.kv > :last-child{font-size:18px;font-weight:600;text-align:right}
.accent{color:var(--accent)}
.week{display:flex;justify-content:space-between}
.day{display:flex;flex-direction:column;align-items:center;gap:6px}
.dot{width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.day.today .dot{border:2px solid var(--accent)}
.day-label{font-size:13px;color:var(--muted)}
.day.today .day-label{color:var(--text);font-weight:600}
.recent{display:flex;flex-direction:column}
.recent .eyebrow{margin-bottom:4px}
.recent-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
.recent-row:last-child{border-bottom:none}
.recent-name{font-size:17px;font-weight:600}
.recent-vals{display:flex;align-items:baseline;gap:10px;font-size:17px;font-weight:600;white-space:nowrap}
.recent-vals .muted{font-size:14px;font-weight:500}

/* ============ HISTORY ============ */
.hist{gap:14px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted);pointer-events:none}
.search .text-input{height:48px;padding-left:44px;border-color:var(--line);background:var(--surface);font-size:16px;border-radius:12px}
.search .text-input::-webkit-search-cancel-button{filter:invert(0.6)}
.hist-list{display:flex;flex-direction:column;gap:18px}
.hist-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column}
.hist-main{display:flex;flex-direction:column;gap:8px;padding:14px 16px;background:none;border:none;text-align:left;width:100%}
.hist-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hist-head .muted{font-size:14px;white-space:nowrap}
.hist-title{font-size:17px;font-weight:600}
.hist-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.hist-ex{display:flex;align-items:center;gap:8px;color:var(--muted)}
.hist-set{font-weight:600;white-space:nowrap}
.pr{height:20px;padding:0 7px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.hist-sets{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--text-2);margin:-2px 0 4px}
.hist-sets b{font-size:11px;color:var(--muted);font-weight:700;margin-right:2px}
.hist-card .text-btn{align-self:flex-start;margin:-6px 12px 6px}

/* ============ LIFT PROGRESS ============ */
.lift{gap:16px}
.lift-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lift-head .title{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.change-lift{display:flex;align-items:center;gap:6px;flex:none}
.e1rm-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.e1rm-big{display:flex;align-items:baseline;gap:6px;font-family:var(--font-num);font-size:68px;font-weight:700;line-height:1}
.e1rm-big .unit{font-family:var(--font-body);font-size:22px;font-weight:500;color:var(--muted)}
.change-pill{height:32px;padding:0 12px;border-radius:16px;background:#1F2A0E;color:var(--accent);font-size:14px;font-weight:600;display:flex;align-items:center;margin-bottom:10px;white-space:nowrap}
.change-pill.down{background:var(--warn-bg);color:var(--warn)}
.segmented{display:flex;gap:4px;background:var(--surface);border-radius:14px;padding:4px}
.segmented button{flex:1;height:44px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-size:15px;font-weight:600}
.segmented button[aria-pressed="true"]{background:var(--line);color:var(--text)}
.chart{display:block;overflow:visible}
.c-grid{stroke:var(--line);stroke-width:1}
.c-text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.c-trend{stroke:#5A606B;stroke-width:1.5;stroke-dasharray:4 4}
.c-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.c-dot{fill:var(--accent)}
.c-last{fill:var(--accent)}
.chart-empty{height:150px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.tiles{display:flex;gap:10px}
.tile{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile-label{font-size:12px;color:var(--muted)}
.tile-val{font-family:var(--font-num);font-size:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-bottom:1px solid var(--line)}
.th-row:last-child{border-bottom:none}
.th-left{display:flex;align-items:center;gap:10px}
.th-date{font-size:15px;color:var(--muted);width:52px}
.th-set{font-size:17px;font-weight:600;white-space:nowrap}
.th-row .muted{font-size:14px;white-space:nowrap}

/* ============ ACTIVE WORKOUT ============ */
.no-tabs #tabs{display:none}
.no-tabs #screen{padding-bottom:var(--tabs-bottom)}
.wk{gap:10px;padding-top:calc(var(--safe-top) + 4px)}
.wk-head{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:8px}
.wk-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:flex-start;color:var(--text);background:none;border:none;padding:0;flex:none}
.wk-title{flex:1;min-width:0;background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center}
.wk-name{font-family:var(--font-num);font-size:32px;font-weight:700;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-sub{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.wk-finish{min-width:44px;height:44px;background:none;border:none;padding:0;font-size:16px;font-weight:600;color:var(--accent);flex:none;text-align:right}
.wk-last{font-size:14px;color:var(--muted)}

.rest-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;transition:background .2s}
.rest-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rest-read{display:flex;align-items:baseline;gap:10px}
.rest-label{font-size:12px;font-weight:600;letter-spacing:0.08em;color:var(--muted)}
.rest-time{font-family:var(--font-num);font-size:34px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.rest-btns{display:flex;gap:8px}
.rest-track{height:4px;border-radius:2px;background:var(--line)}
.rest-bar{height:4px;border-radius:2px;background:var(--accent)}
.rest-card.rest-done{background:var(--accent);border-color:var(--accent);animation:rest-pulse 1s ease-in-out 3}
.rest-done .rest-label,.rest-done .rest-time{color:var(--on-accent)}
.rest-done .chip-btn{border-color:rgba(14,15,17,.35);color:var(--on-accent)}
.rest-done .rest-track{background:rgba(14,15,17,.2)}
.rest-done .rest-bar{background:var(--on-accent)}
@keyframes rest-pulse{50%{transform:scale(1.02)}}

.sets{display:flex;flex-direction:column;gap:4px}
.set-head,.set-main{display:grid;grid-template-columns:44px 1fr 1fr;column-gap:10px;align-items:center}
.set-head{grid-template-columns:44px 1fr 1fr 44px;font-size:12px;font-weight:600;letter-spacing:0.08em;color:var(--muted)}
.set-row{display:flex;align-items:center;gap:10px;min-height:52px}
.set-main{flex:1;min-height:48px;background:none;border:none;padding:0;text-align:left;color:var(--muted)}
.set-row.done .set-main{color:var(--text-2)}
.badge small{font-size:10px;margin-left:1px}
.badge{min-width:36px;padding:0 4px;height:24px;border-radius:8px;background:var(--raised);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:inherit}
.set-num{font-family:var(--font-num);font-size:26px;font-weight:600;line-height:1}
.fail-mark{font-family:var(--font-body);font-size:11px;font-weight:700;color:var(--accent);margin-left:6px;vertical-align:super}
.tick{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:transparent;border:1.5px solid var(--line-strong);padding:0;touch-action:manipulation}
.tick.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.set-editor{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;margin:4px 0}
.set-editor.type-top{border-color:var(--accent)}
.ed-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.ed-badge{height:28px;padding:0 12px;border-radius:8px;background:var(--raised);color:var(--text);font-size:13px;font-weight:700;letter-spacing:0.06em;display:flex;align-items:center}
.type-top .ed-badge{background:var(--accent);color:var(--on-accent)}
.fail-btn{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.fail-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.stepper{display:flex;align-items:center;gap:8px}
.st-label{width:44px;font-size:12px;font-weight:600;letter-spacing:0.08em;color:var(--muted);flex:none}
.st-btn{width:52px;height:52px;border-radius:14px;border:none;background:var(--raised);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none;touch-action:manipulation}
.st-btn:active{background:var(--line-strong)}
.st-val{flex:1;min-width:0;width:100%;text-align:center;font-family:var(--font-num);font-size:50px;font-weight:700;line-height:1;background:transparent;border:none;color:var(--text);padding:0;border-radius:10px}
.st-val:focus{outline:2px solid var(--accent);outline-offset:2px}
.live{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;font-size:14px;min-height:20px}
.live-e1rm{color:var(--accent);font-weight:600}
.live-plates{color:var(--muted)}
.set-editor .text-btn{align-self:center;margin-top:-4px}

.add-sets{display:flex;gap:8px;margin-top:2px}
.wk-next{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin-top:8px;padding:0 4px;border:none;border-top:1px solid var(--line);background:none;font-size:15px;color:var(--muted);width:100%;text-align:left}

/* ============ SHEET ============ */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:12px 20px calc(var(--safe-bottom) + 16px);display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-list{display:flex;flex-direction:column}
.sheet-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.sheet-row.current .sheet-jump span:first-child{color:var(--accent)}
.sheet-jump{flex:1;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:none;padding:0;font-size:17px;font-weight:600;text-align:left}
.sheet-jump .muted{font-size:14px;font-weight:500}
.sheet .wk-icon{justify-content:center;color:var(--muted)}
.equip{display:flex;flex-wrap:wrap;gap:8px}
.equip-chip input{position:absolute;opacity:0;pointer-events:none}
.equip-chip span{display:flex;align-items:center;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);font-size:15px;font-weight:600;color:var(--muted)}
.equip-chip input:checked + span{border-color:var(--accent);color:var(--accent)}
.equip-chip input:focus-visible + span{outline:2px solid var(--accent)}
.ex-form{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:8px}
.field-label{font-size:13px;font-weight:600;letter-spacing:0.04em;color:var(--muted);margin-top:4px}
.field-label .muted{font-weight:500;letter-spacing:0}
.more{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.more summary{min-height:48px;display:flex;align-items:center;font-size:15px;font-weight:600;color:var(--text-2);cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:'+';margin-left:auto;font-size:22px;color:var(--muted)}
.more[open] summary::after{content:'−'}
.more-body{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.ex-form .equip-chip span{height:40px;padding:0 12px;font-size:14px}
.check-row{display:flex;align-items:center;gap:12px;min-height:48px;font-size:16px}
.check-row input{width:22px;height:22px;accent-color:var(--accent)}
.ex-form:not(:has(input[name=equipment][value=cable]:checked)) .only-cable{display:none}
.ex-form:not(:has(input[name=equipment]:is([value=barbell],[value=ezbar],[value=trapbar],[value=smith],[value=plate-loaded]):checked)) .only-plates{display:none}
.ex-details{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;width:100%;min-height:44px;padding:8px 0;background:none;border:none;text-align:left;font-size:14px;line-height:1.4;color:var(--text-2)}
.ex-line{flex:1 1 200px}
.ex-setup{order:3;flex-basis:100%;color:var(--warn)}
.ex-edit{color:var(--accent);font-weight:600}
.sheet-name{display:flex;flex-direction:column;gap:2px}
.sheet-name small{font-size:13px;font-weight:500;color:var(--muted)}

/* ============ TAB BAR ============ */
/* Fixed to the bottom edge rather than placed by the page height, which iOS home-screen apps report unreliably. */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;padding:6px 12px var(--tabs-bottom);border-top:1px solid var(--line);background:var(--bg)}
#tabs a{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:500}
#tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
#tabs svg{width:24px;height:24px}
#tabs a{position:relative}
#tabs a.alert::after{content:'';position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
a.banner{text-decoration:none;color:inherit}

/* ============ TOAST ============ */
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabs-bottom) + 70px);margin:0 auto;max-width:420px;background:var(--raised);border:1px solid var(--line-strong);color:var(--text);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.4;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:10}
#toast.show{opacity:1;transform:none}
</style>
