<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Gym Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0E0F11;
  --surface:#17191D;
  --raised:#1F2227;
  --line:#2A2E35;
  --line-strong:#3A3F48;
  --text:#F2F3F5;
  --text-2:#C9CCD2;
  --muted:#9EA3AD;
  --accent:#C8F54A;
  --on-accent:#0E0F11;
  --warn:#F5B84A;
  --warn-bg:#241D0E;
  --warn-line:#4A3A12;
  --font-body:'Barlow', system-ui, -apple-system, sans-serif;
  --font-num:'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  --safe-top:max(env(safe-area-inset-top), 20px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  /* Space under the tab bar: 28px on an iPhone 16 Pro (34px home-indicator inset), like the design and iOS tab bars. */
  --tabs-bottom:max(calc(var(--safe-bottom) - 6px), 8px);
  color-scheme:dark;
}

/* ============ BASE ============ */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-body);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}

#screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen{padding:calc(var(--safe-top) + 12px) 20px 24px;display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}

/* ============ TYPE ============ */
.date{font-size:15px;font-weight:500;color:var(--muted)}
.title{margin:2px 0 0;font-family:var(--font-num);font-size:48px;font-weight:700;line-height:1;letter-spacing:0.01em}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase}
.lead{font-size:16px;line-height:1.45;color:var(--text-2)}
.note{font-size:13px;line-height:1.45;color:var(--muted)}
.center{text-align:center}

/* ============ BLOCKS ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px;display:flex;flex-direction:column}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--line);font-size:16px}
.list-row:last-child{border-bottom:none}
.list-row > :first-child{color:var(--text-2)}
.list-row > :last-child{font-weight:600}

.banner{border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.banner .dot{width:10px;height:10px;border-radius:50%;flex:none}
.banner-title{font-size:17px;font-weight:600}
.banner-sub{font-size:14px;color:var(--text-2);margin-top:2px}
.banner.warn{background:var(--warn-bg);border:1px solid var(--warn-line)}
.banner.warn .dot{background:var(--warn)}
.banner.warn .banner-title{color:var(--warn)}
.banner.ok{background:var(--surface);border:1px solid var(--line)}
.banner.ok .dot{background:var(--accent)}

.stack{display:flex;flex-direction:column;gap:10px}
.btn{height:56px;width:100%;border-radius:14px;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;border:none;touch-action:manipulation}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:transparent;border:1px solid var(--line-strong);color:var(--text)}
.btn:active{opacity:0.8;transform:scale(0.99)}
.btn:disabled{opacity:0.45}

.toggle-row{display:flex;justify-content:space-between;align-items:center;min-height:52px;font-size:16px;font-weight:500}
.switch{width:56px;height:34px;border:none;border-radius:17px;background:var(--line-strong);padding:3px;display:flex;justify-content:flex-start;align-items:center;flex:none}
.switch span{width:28px;height:28px;border-radius:50%;background:var(--text);display:block}
.switch[aria-checked="true"]{background:var(--accent);justify-content:flex-end}
.switch[aria-checked="true"] span{background:var(--on-accent)}

/* ============ TAB BAR ============ */
#tabs{display:flex;padding:6px 12px var(--tabs-bottom);border-top:1px solid var(--line);background:var(--bg)}
#tabs a{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:500}
#tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
#tabs svg{width:24px;height:24px}

/* ============ TOAST ============ */
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabs-bottom) + 70px);margin:0 auto;max-width:420px;background:var(--raised);border:1px solid var(--line-strong);color:var(--text);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.4;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:10}
#toast.show{opacity:1;transform:none}
</style>
</head>
<body>
<main id="screen" aria-live="polite"></main>

<nav id="tabs" aria-label="Main">
  <a href="#today" data-tab="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
    <span>Today</span>
  </a>
  <a href="#history" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>History</span>
  </a>
  <a href="#lift" data-tab="lift">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>
    <span>Lifts</span>
  </a>
  <a href="#backup" data-tab="backup">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
    <span>Backup</span>
  </a>
</nav>

<div id="toast" role="status"></div>

<script>
/* Release routine: bump these, bump CACHE in sw.js, run the tests, push to main. */
var APP_VERSION = "0.1.1";
var APP_WHATS_NEW = "the tab bar now sits lower, like the iPhone's own tab bars";
</script>
<script type="module" src="src/app.js"></script>
</body>
</html>
